<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictionary on Click</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <h1>Dictionary</h1>
        <a class="options-link" href="#" id="open-options" title="Settings">Settings</a>
      </header>
      <form id="lookup-form">
        <input
          id="word-input"
          type="search"
          placeholder="Look up a word or phrase…"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">Look up</button>
      </form>
      <label class="lang-label">
        Language
        <select id="language-select"></select>
      </label>
      <div class="translation-controls">
        <label class="checkbox-label">
          <input type="checkbox" id="translations-enabled" />
          Show translations <span class="feature-beta">(beta)</span>
        </label>
        <label class="lang-label translation-target-label" id="translation-target-label" hidden>
          Translate to
          <select id="target-language-select"></select>
        </label>
      </div>
      <label class="checkbox-label syn-ant-label">
        <input type="checkbox" id="synonyms-antonyms-enabled" />
        Show synonyms &amp; antonyms <span class="feature-beta">(beta)</span>
      </label>
      <label class="lang-label theme-label">
        Theme
        <select id="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <div id="result" class="result" aria-live="polite"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
